<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green ribbon</title>
<style>
  html, body { margin: 0; height: 100%; background: transparent; }
  .plume { position: absolute; inset: 0; }
  .plume canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="plume"><canvas id="ribbon-canvas" aria-hidden="true"></canvas></div>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform sampler2D T0;
uniform vec2 R;   // размер канваса, px
uniform vec2 S;   // размер картинки на экране, px
uniform float P;  // фаза цикла 0..1
const float TAU = 6.2831853;

float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}
// шум, дрейфующий по кругу: целые множители угла => бесшовный цикл
float fbm(vec2 p, float a){
  float s = 0.0, k = 0.5;
  for (int i = 0; i < 4; i++){
    float m = 1.0 + mod(float(i), 2.0);
    vec2 o = vec2(cos(a * m + float(i)), sin(a * m + float(i))) * 0.9;
    s += k * vn(p + o);
    p = p * 2.03 + vec2(17.1, 9.2);
    k *= 0.5;
  }
  return s / 0.94;
}
// мягкое растворение краёв исходника: дым нигде не обрезается жёстко
float edge(vec2 u){
  return smoothstep(0.0, 0.015, u.x) * smoothstep(0.0, 0.015, 1.0 - u.x)
       * smoothstep(0.0, 0.05, u.y) * smoothstep(0.0, 0.05, 1.0 - u.y);
}

void main(){
  vec2 uv = (gl_FragCoord.xy - 0.5 * R) / S + 0.5;
  if (uv.x < -0.02 || uv.x > 1.02 || uv.y < -0.02 || uv.y > 1.02) { gl_FragColor = vec4(0.0); return; }

  float a = P * TAU;
  float asp = S.x / S.y;
  vec2 q = vec2(uv.x * asp, uv.y);
  float ew = edge(uv);

  // «кипение» дыма: турбулентность (в долях высоты кадра, по x делим на asp)
  vec2 n = vec2(fbm(q * 2.4, a), fbm(q * 2.4 + vec2(4.1, 7.3), a + 1.7)) - 0.5;
  vec2 m = vec2(fbm(q * 6.5 + 3.0, a), fbm(q * 6.5 + vec2(9.0, 2.0), a + 2.9)) - 0.5;
  vec2 d = n * 0.075 + m * 0.032;
  d.x /= asp;

  // S-образная лента переливается бегущей волной, кончики хлещут
  float tl = smoothstep(0.22, 0.0, uv.x);
  float tr = smoothstep(0.78, 1.0, uv.x);
  d.y += 0.030 * sin(TAU * uv.x * 1.5 - a);
  d.y += 0.060 * (tl * sin(a) + tr * sin(a - 1.7));
  d.x += 0.012 / asp * (tl * sin(a + 1.0) - tr * sin(a));

  // лёгкий разворот вокруг светлого ядра
  vec2 r = vec2((uv.x - 0.54) * asp, uv.y - 0.62);
  float th = 0.14 * sin(a) * exp(-dot(r, r) / 0.05);
  vec2 rr = vec2(cos(th) * r.x - sin(th) * r.y, sin(th) * r.x + cos(th) * r.y);
  d += vec2((rr.x - r.x) / asp, rr.y - r.y);

  d *= ew;                       // у границ кадра смещение гаснет
  vec2 s = uv + d;
  vec4 c = texture2D(T0, clamp(s, 0.0, 1.0)) * edge(s);

  // пульсация светлого ядра и внутреннее мерцание
  vec3 un = c.rgb / max(c.a, 0.001);
  float hot = smoothstep(0.55, 0.95, un.b);
  float pulse = 0.22 * sin(a - uv.x * 3.0) + 0.14 * sin(2.0 * a + 1.5);
  float shim = (fbm(q * 5.0 + vec2(2.0, 8.0), a * 2.0) - 0.5) * 0.5;
  vec3 rgb = c.rgb * (1.0 + shim * (0.6 + 0.4 * (1.0 - hot))) + hot * pulse * c.a * vec3(0.9, 1.0, 0.55);

  // искры, рождающиеся внутри дыма
  float sp = 0.0;
  for (int L = 0; L < 2; L++){
    float sc = L == 0 ? 34.0 : 64.0;
    vec2 g = q * sc;
    vec2 cc = floor(g), f = fract(g);
    float rn = h(cc + float(L) * 7.3);
    vec2 pos = 0.5 + 0.3 * vec2(sin(a + rn * TAU), cos(a * 2.0 + rn * 17.0));
    float tw = 0.5 + 0.5 * sin(a * 2.0 + rn * TAU);
    vec2 cu = vec2((cc.x + 0.5) / sc / asp, (cc.y + 0.5) / sc);
    float al = texture2D(T0, clamp(cu, 0.0, 1.0)).a * edge(cu);
    sp += step(0.88, rn) * smoothstep(0.15, 0.0, length(f - pos)) * tw * smoothstep(0.1, 0.4, al);
  }
  float oa = max(c.a, sp * 0.8);
  rgb += vec3(0.75, 1.0, 0.35) * sp * 0.8;
  rgb = min(max(rgb, 0.0), vec3(oa));
  gl_FragColor = vec4(rgb, oa);   // premultiplied alpha
}
</script>

  const cv = document.getElementById('ribbon-canvas');
  const gl = cv.getContext('webgl', { alpha: true, premultipliedAlpha: true, antialias: false });
  if (!gl) return;

  const T = 12;          // длительность бесшовного цикла, сек
  const MAX_DPR = 1.5;   // потолок разрешения рендера
  const PAD = 0.03;      // поля вокруг картинки: ничего не упирается в край кадра

  // фон для предпросмотра: ?bg=dark | white | checker  (на сайте не нужен)
  const bg = new URLSearchParams(location.search).get('bg');

  if (bg === 'white') document.body.style.background = '#fff';

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };

  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(pr, 'R'), uS = gl.getUniformLocation(pr, 'S'), uP = gl.getUniformLocation(pr, 'P');
  gl.clearColor(0, 0, 0, 0);

  const img = new Image();
  let iw = 1, ih = 1;

  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    const r = cv.getBoundingClientRect();
    cv.width = Math.max(1, Math.round(r.width * d));
    cv.height = Math.max(1, Math.round(r.height * d));
    gl.viewport(0, 0, cv.width, cv.height);
    const k = Math.min(cv.width * (1 - 2 * PAD) / iw, cv.height * (1 - 2 * PAD) / ih);  // contain
    gl.uniform2f(uR, cv.width, cv.height);
    gl.uniform2f(uS, iw * k, ih * k);
  }
  const draw = p => { gl.clear(gl.COLOR_BUFFER_BIT); gl.uniform1f(uP, p); gl.drawArrays(gl.TRIANGLES, 0, 3); };

  img.onload = () => {
    iw = img.naturalWidth; ih = img.naturalHeight;
    const tex = gl.createTexture();
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
    gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, img);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
    gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

  function start() {
    const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
    addEventListener('resize', () => { resize(); if (still) draw(0.15); });
    if (still) { draw(0.15); return; }

    let running = true;
    const t0 = performance.now();
    const frame = now => {
      if (!running) return;
      draw((((now - t0) / 1000) % T) / T);
      requestAnimationFrame(frame);
    };
    new IntersectionObserver(([e]) => {
      const was = running; running = e.isIntersecting;
      if (running && !was) requestAnimationFrame(frame);
    }).observe(cv);
    requestAnimationFrame(frame);
  }
})();
