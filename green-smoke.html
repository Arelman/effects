<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green smoke</title>
<style>
  html, body { margin: 0; height: 100%; background: #030705; }
  .smoke { position: relative; width: 100%; aspect-ratio: 16 / 9; max-height: 100vh; margin: 0 auto; background: #030705; overflow: hidden; }
  .smoke canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="smoke"><canvas id="smoke-canvas" aria-hidden="true"></canvas></div>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;
uniform float P;
const float TAU = 6.2831853;

float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}
// шум, дрейфующий по кругу: целые множители угла => бесшовный цикл
float fbm(vec2 p, float a){
  float s = 0.0, k = 0.5;
  for (int i = 0; i < 5; i++){
    float m = 1.0 + mod(float(i), 2.0);
    vec2 o = vec2(cos(a * m + float(i)), sin(a * m + float(i))) * 0.9;
    s += k * vn(p + o);
    p = p * 2.03 + vec2(17.1, 9.2);
    k *= 0.5;
  }
  return s / 0.97;
}

void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  float a = P * TAU;
  vec2 p = vec2(uv.x * asp, uv.y);

  vec2 w = vec2(fbm(p * 2.2, a), fbm(p * 2.2 + vec2(5.2, 1.3), a + 1.0)) - 0.5;
  vec2 q = p + w * 0.24;
  float x = q.x / asp, y = q.y;

  // лента слева направо
  float cy = 0.84 - 0.16 * x + 0.05 * sin(x * 13.0 - a) + 0.025 * sin(x * 27.0 + 2.0 * a);
  float wd = 0.035 + 0.10 * smoothstep(0.25, 0.85, x);
  float d = (y - cy) / wd;
  float ribbon = exp(-d * d * 0.9) * smoothstep(-0.02, 0.1, x);

  // плотное облако справа и шлейф вниз
  vec2 e = vec2(x - 0.78, y - 0.62);
  float plume = exp(-(e.x * e.x / 0.02 + e.y * e.y / 0.045));
  float tail = 0.6 * exp(-((x - 0.86) * (x - 0.86) / 0.012 + (y - 0.28) * (y - 0.28) / 0.04));
  float body = clamp(ribbon + plume * 1.2 + tail, 0.0, 1.5);

  // нитевидная текстура дыма
  float n = fbm(q * vec2(5.5, 5.5) + vec2(0.0, 3.0), a);
  float ridge = pow(1.0 - abs(2.0 * n - 1.0), 3.0);
  float n2 = fbm(q * 11.0, a);
  float fil = ridge * 0.9 + 0.25 * n2;
  float den = body * (0.22 + 1.15 * fil);

  float hot = clamp(plume * 1.1 + ribbon * 0.4 * smoothstep(0.4, 0.9, x), 0.0, 1.0);
  hot = pow(hot, 1.5) * (0.4 + 0.9 * ridge);

  vec3 col = vec3(0.03, 0.34, 0.05) * den
           + vec3(0.50, 1.00, 0.10) * pow(den, 2.2) * 1.2
           + vec3(1.00) * hot * hot * 1.7;
  col = 1.0 - exp(-col * 1.35);

  // искры и пыль вдоль потока
  float sp = 0.0;
  for (int L = 0; L < 2; L++){
    float s = L == 0 ? 38.0 : 70.0;
    vec2 g = vec2(uv.x * asp, uv.y) * s;
    vec2 c = floor(g), f = fract(g);
    float r = h(c + float(L) * 7.0);
    vec2 pos = 0.5 + 0.3 * vec2(sin(a + r * TAU), cos(a * 2.0 + r * 17.0));
    float dist = length(f - pos);
    float tw = 0.5 + 0.5 * sin(a * 2.0 + r * TAU);
    float near = exp(-pow(abs(y - cy - 0.08), 2.0) * 14.0) * smoothstep(0.0, 0.5, x) + plume * 0.8;
    sp += step(0.86, r) * smoothstep(0.16, 0.0, dist) * tw * clamp(near, 0.0, 1.0);
  }
  col += vec3(0.55, 1.0, 0.2) * sp * 0.9;

  col += vec3(0.008, 0.02, 0.012);
  col -= h(gl_FragCoord.xy) / 255.0;  // против бэндинга
  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
(() => {
  const cv = document.getElementById('smoke-canvas');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return;

  const T = 16;                 // длительность бесшовного цикла, сек
  const MAX_DPR = 1.5;          // потолок разрешения рендера (экономит GPU)

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  const uR = gl.getUniformLocation(pr, 'R'), uP = gl.getUniformLocation(pr, 'P');

  function resize() {
    const d = Math.min(window.devicePixelRatio || 1, MAX_DPR);
    const r = cv.getBoundingClientRect();
    cv.width = Math.round(r.width * d);
    cv.height = Math.round(r.height * d);
    gl.viewport(0, 0, cv.width, cv.height);
    gl.uniform2f(uR, cv.width, cv.height);
  }
  const draw = p => { gl.uniform1f(uP, p); gl.drawArrays(gl.TRIANGLES, 0, 3); };
  resize();

  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (still) { addEventListener('resize', () => { resize(); draw(0.15); }); draw(0.15); return; }

  let running = true;
  const t0 = performance.now();
  const frame = now => {
    if (!running) return;
    draw((((now - t0) / 1000) % T) / T);
    requestAnimationFrame(frame);
  };
  addEventListener('resize', resize);
  new IntersectionObserver(([e]) => {
    const was = running; running = e.isIntersecting;
    if (running && !was) requestAnimationFrame(frame);
  }).observe(cv);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
