<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green smoke v2 A</title>
<style>
  html, body { margin: 0; height: 100%; background: #111412; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* Фиксированный кадр 16:9 (1920×1080), целиком вписан в окно — ничего не обрезается */
  .stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #111412; }
  .stage canvas { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
<div class="stage"><canvas id="c" width="1920" height="1080" aria-hidden="true"></canvas></div>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;
uniform float P;
const float TAU = 6.2831853;
const vec3 BG = vec3(0.0667, 0.0784, 0.0706); // #111412

float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p, float a){
  float s = 0.0, k = 0.5;
  for (int i = 0; i < 5; i++){
    float m = 1.0 + mod(float(i), 2.0);
    vec2 o = vec2(cos(a * m + float(i)), sin(a * m + float(i))) * 0.9;
    s += k * vn(p + o);
    p = p * 2.03 + vec2(17.1, 9.2);
    k *= 0.5;
  }
  return s / 0.97;
}
float seg(vec2 p, vec2 a, vec2 b, float w1, float w2){
  vec2 ab = b - a; float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
  float d = length(p - a - ab * t), w = mix(w1, w2, t);
  return exp(-d * d / (w * w) * 0.9);
}
float blob(vec2 p, vec2 c, float rx, float ry){
  vec2 e = p - c; return exp(-(e.x * e.x / (rx * rx) + e.y * e.y / (ry * ry)));
}

const vec2 CORE0 = vec2(0.1624,0.3316);
const vec2 CORE1 = vec2(0.1761,0.1578);
const float SPREAD = 0.55;
const float WARP = 0.17;
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  float a = P * TAU;
  vec2 p0 = vec2(uv.x * asp, uv.y);
  vec2 pc = p0 - vec2(asp * 0.5, 0.5);

  // энергетический завиток вокруг ядра
  vec2 d0 = pc - CORE0; float r0 = length(d0);
  float ang = 0.5 * sin(a) * exp(-r0 * 2.0);
  float cs = cos(ang), sn = sin(ang);
  vec2 ps = CORE0 + vec2(cs * d0.x - sn * d0.y, sn * d0.x + cs * d0.y);

  // двойной варп — округлые, «взбитые» формы
  vec2 w1 = vec2(fbm(ps * 1.6 + 3.0, a), fbm(ps * 1.6 + vec2(5.2, 1.3), a + 1.0)) - 0.5;
  vec2 w2 = vec2(fbm(ps * 3.6 + w1 * 1.6, a + 2.0), fbm(ps * 3.6 + vec2(1.7, 8.3) + w1 * 1.6, a + 3.0)) - 0.5;
  vec2 q = ps + w1 * WARP + w2 * 0.06;
  vec2 p = q;

  float b = 0.0, hb = 0.0;
  b = max(b, seg(p, vec2(-0.2767,0.4048), vec2(-0.1990,0.3453), 0.0114, 0.0160));
  b = max(b, blob(p, vec2(-0.2702,0.3998), 0.0154, 0.0154) * 0.75);
  b = max(b, blob(p, vec2(-0.2573,0.3899), 0.0164, 0.0164) * 0.75);
  b = max(b, blob(p, vec2(-0.2443,0.3800), 0.0173, 0.0173) * 0.75);
  b = max(b, blob(p, vec2(-0.2314,0.3701), 0.0183, 0.0183) * 0.75);
  b = max(b, blob(p, vec2(-0.2184,0.3602), 0.0193, 0.0193) * 0.75);
  b = max(b, blob(p, vec2(-0.2054,0.3503), 0.0203, 0.0203) * 0.75);
  b = max(b, seg(p, vec2(-0.1990,0.3453), vec2(-0.1304,0.3407), 0.0160, 0.0183));
  b = max(b, blob(p, vec2(-0.1904,0.3447), 0.0212, 0.0212) * 0.75);
  b = max(b, blob(p, vec2(-0.1732,0.3436), 0.0219, 0.0219) * 0.75);
  b = max(b, blob(p, vec2(-0.1561,0.3425), 0.0227, 0.0227) * 0.75);
  b = max(b, blob(p, vec2(-0.1389,0.3413), 0.0234, 0.0234) * 0.75);
  b = max(b, seg(p, vec2(-0.1304,0.3407), vec2(-0.0983,0.3865), 0.0183, 0.0183));
  b = max(b, blob(p, vec2(-0.1250,0.3484), 0.0238, 0.0238) * 0.75);
  b = max(b, blob(p, vec2(-0.1143,0.3636), 0.0238, 0.0238) * 0.75);
  b = max(b, blob(p, vec2(-0.1037,0.3789), 0.0238, 0.0238) * 0.75);
  b = max(b, seg(p, vec2(-0.0983,0.3865), vec2(-0.0389,0.4139), 0.0183, 0.0229));
  b = max(b, blob(p, vec2(-0.0884,0.3911), 0.0248, 0.0248) * 0.75);
  b = max(b, blob(p, vec2(-0.0686,0.4002), 0.0268, 0.0268) * 0.75);
  b = max(b, blob(p, vec2(-0.0488,0.4094), 0.0287, 0.0287) * 0.75);
  b = max(b, seg(p, vec2(-0.0389,0.4139), vec2(0.0526,0.3911), 0.0229, 0.0274));
  b = max(b, blob(p, vec2(-0.0274,0.4111), 0.0305, 0.0305) * 0.75);
  b = max(b, blob(p, vec2(-0.0046,0.4054), 0.0320, 0.0320) * 0.75);
  b = max(b, blob(p, vec2(0.0183,0.3996), 0.0334, 0.0334) * 0.75);
  b = max(b, blob(p, vec2(0.0412,0.3939), 0.0349, 0.0349) * 0.75);
  b = max(b, seg(p, vec2(0.0526,0.3911), vec2(0.1441,0.3590), 0.0274, 0.0366));
  b = max(b, blob(p, vec2(0.0678,0.3857), 0.0377, 0.0377) * 0.75);
  b = max(b, blob(p, vec2(0.0983,0.3750), 0.0416, 0.0416) * 0.75);
  b = max(b, blob(p, vec2(0.1288,0.3644), 0.0456, 0.0456) * 0.75);
  b = max(b, seg(p, vec2(0.1441,0.3590), vec2(0.1669,0.3270), 0.0366, 0.0457));
  b = max(b, blob(p, vec2(0.1555,0.3430), 0.0535, 0.0535) * 0.75);
  b = max(b, seg(p, vec2(0.1669,0.3270), vec2(0.1761,0.2493), 0.0457, 0.0274));
  b = max(b, blob(p, vec2(0.1692,0.3076), 0.0535, 0.0535) * 0.75);
  b = max(b, blob(p, vec2(0.1738,0.2687), 0.0416, 0.0416) * 0.75);
  b = max(b, seg(p, vec2(0.1761,0.2493), vec2(0.1578,0.1807), 0.0274, 0.0274));
  b = max(b, blob(p, vec2(0.1715,0.2321), 0.0357, 0.0357) * 0.75);
  b = max(b, blob(p, vec2(0.1624,0.1978), 0.0357, 0.0357) * 0.75);
  b = max(b, seg(p, vec2(0.1578,0.1807), vec2(0.1669,0.1349), 0.0274, 0.0320));
  b = max(b, blob(p, vec2(0.1624,0.1578), 0.0386, 0.0386) * 0.75);
  b = max(b, seg(p, vec2(0.1669,0.1349), vec2(0.2218,0.0663), 0.0320, 0.0320));
  b = max(b, blob(p, vec2(0.1761,0.1235), 0.0416, 0.0416) * 0.75);
  b = max(b, blob(p, vec2(0.1944,0.1006), 0.0416, 0.0416) * 0.75);
  b = max(b, blob(p, vec2(0.2127,0.0778), 0.0416, 0.0416) * 0.75);
  b = max(b, seg(p, vec2(0.2218,0.0663), vec2(0.2584,-0.0252), 0.0320, 0.0297));
  b = max(b, blob(p, vec2(0.2279,0.0511), 0.0411, 0.0411) * 0.75);
  b = max(b, blob(p, vec2(0.2401,0.0206), 0.0401, 0.0401) * 0.75);
  b = max(b, blob(p, vec2(0.2523,-0.0099), 0.0391, 0.0391) * 0.75);
  b = max(b, seg(p, vec2(0.2584,-0.0252), vec2(0.2630,-0.0938), 0.0297, 0.0274));
  b = max(b, blob(p, vec2(0.2596,-0.0423), 0.0379, 0.0379) * 0.75);
  b = max(b, blob(p, vec2(0.2618,-0.0766), 0.0364, 0.0364) * 0.75);
  b = max(b, seg(p, vec2(0.2630,-0.0938), vec2(0.2127,-0.1532), 0.0274, 0.0229));
  b = max(b, blob(p, vec2(0.2546,-0.1037), 0.0347, 0.0347) * 0.75);
  b = max(b, blob(p, vec2(0.2378,-0.1235), 0.0327, 0.0327) * 0.75);
  b = max(b, blob(p, vec2(0.2211,-0.1433), 0.0307, 0.0307) * 0.75);
  b = max(b, seg(p, vec2(0.2127,-0.1532), vec2(0.1807,-0.2310), 0.0229, 0.0229));
  b = max(b, blob(p, vec2(0.2087,-0.1629), 0.0297, 0.0297) * 0.75);
  b = max(b, blob(p, vec2(0.2007,-0.1824), 0.0297, 0.0297) * 0.75);
  b = max(b, blob(p, vec2(0.1927,-0.2018), 0.0297, 0.0297) * 0.75);
  b = max(b, blob(p, vec2(0.1847,-0.2213), 0.0297, 0.0297) * 0.75);
  b = max(b, seg(p, vec2(0.1807,-0.2310), vec2(0.1944,-0.2996), 0.0229, 0.0252));
  b = max(b, blob(p, vec2(0.1830,-0.2424), 0.0302, 0.0302) * 0.75);
  b = max(b, blob(p, vec2(0.1875,-0.2653), 0.0312, 0.0312) * 0.75);
  b = max(b, blob(p, vec2(0.1921,-0.2881), 0.0322, 0.0322) * 0.75);
  b = max(b, seg(p, vec2(0.1944,-0.2996), vec2(0.2355,-0.3682), 0.0252, 0.0183));
  b = max(b, blob(p, vec2(0.1995,-0.3082), 0.0316, 0.0316) * 0.75);
  b = max(b, blob(p, vec2(0.2098,-0.3253), 0.0294, 0.0294) * 0.75);
  b = max(b, blob(p, vec2(0.2201,-0.3425), 0.0271, 0.0271) * 0.75);
  b = max(b, blob(p, vec2(0.2304,-0.3596), 0.0249, 0.0249) * 0.75);
  b = max(b, seg(p, vec2(0.2355,-0.3682), vec2(0.2653,-0.4139), 0.0183, 0.0082));
  b = max(b, blob(p, vec2(0.2405,-0.3758), 0.0216, 0.0216) * 0.75);
  b = max(b, blob(p, vec2(0.2504,-0.3911), 0.0172, 0.0172) * 0.75);
  b = max(b, blob(p, vec2(0.2603,-0.4063), 0.0129, 0.0129) * 0.75);
  b = max(b, seg(p, vec2(0.1669,0.1395), vec2(0.0938,0.0435), 0.0229, 0.0183));
  b = max(b, blob(p, vec2(0.1608,0.1315), 0.0292, 0.0292) * 0.75);
  b = max(b, blob(p, vec2(0.1486,0.1155), 0.0282, 0.0282) * 0.75);
  b = max(b, blob(p, vec2(0.1365,0.0995), 0.0273, 0.0273) * 0.75);
  b = max(b, blob(p, vec2(0.1243,0.0835), 0.0263, 0.0263) * 0.75);
  b = max(b, blob(p, vec2(0.1121,0.0675), 0.0253, 0.0253) * 0.75);
  b = max(b, blob(p, vec2(0.0999,0.0515), 0.0243, 0.0243) * 0.75);
  b = max(b, seg(p, vec2(0.0938,0.0435), vec2(0.1121,0.0069), 0.0183, 0.0160));
  b = max(b, blob(p, vec2(0.0983,0.0343), 0.0230, 0.0230) * 0.75);
  b = max(b, blob(p, vec2(0.1075,0.0160), 0.0216, 0.0216) * 0.75);
  b = max(b, blob(p, vec2(0.1669,0.3270), 0.0915, 0.0732) * 0.9);
  b = max(b, blob(p, vec2(0.1807,0.1807), 0.0595, 0.0686) * 0.6);
  hb = max(hb, blob(p, vec2(0.1624,0.3316), 0.0503, 0.0412) * 1.0);
  hb = max(hb, blob(p, vec2(0.1761,0.1578), 0.0320, 0.0686) * 0.6);
  hb = max(hb, 0.35 * b * b);
  float body = clamp(1.0 - exp(-b * 1.7), 0.0, 1.3);

  float n = fbm(q * 4.0 + vec2(0.0, 3.0), a);
  float ridge = pow(1.0 - abs(2.0 * n - 1.0), 2.0);
  float n2 = fbm(q * 8.0, a);
  float fil = ridge * 0.7 + 0.45 * n2;
  float den = body * (0.3 + 1.1 * fil);
  float rq = length(q - CORE0);
  den *= 0.85 + 0.3 * (0.5 + 0.5 * sin(rq * 16.0 - a * 2.0)) * exp(-rq * 1.5);

  float hot = clamp(hb * 1.15, 0.0, 1.0);
  hot = pow(hot, 1.4) * (0.45 + 0.9 * ridge) * (0.88 + 0.24 * sin(a * 2.0));

  vec3 col = vec3(0.03, 0.36, 0.05) * den
           + vec3(0.50, 1.00, 0.10) * pow(den, 2.0) * 1.25
           + vec3(1.00) * hot * hot * 1.8;
  col = 1.0 - exp(-col * 1.4);

  // брызги: круглые капли, вылетающие из ядер по дуге
  float dr = 0.0, dc = 0.0;
  for (int i = 0; i < 26; i++){
    float fi = float(i);
    float r = h(vec2(fi, 3.3)), r2 = h(vec2(fi, 9.1)), r3 = h(vec2(fi, 5.7));
    float ph = fract(P * 2.0 + r);
    vec2 c = mod(fi, 2.0) < 1.0 ? CORE0 : CORE1;
    float an = r2 * TAU;
    vec2 pos = c + vec2(cos(an), sin(an)) * (0.05 + ph * SPREAD * (0.4 + 0.6 * r3));
    pos.y -= 0.12 * ph * ph;
    float sz = (0.004 + 0.010 * r3) * (1.0 - 0.6 * ph);
    float d = length(pc - pos);
    float al = smoothstep(0.0, 0.08, ph) * (1.0 - ph);
    dr += (smoothstep(sz, sz * 0.35, d) + 0.35 * exp(-d * d / (sz * sz * 9.0))) * al;
    dc += smoothstep(sz * 0.5, 0.0, d) * al;
  }
  col += vec3(0.5, 1.0, 0.15) * dr * 0.9 + vec3(1.0) * dc * 0.8;

  // мелкая пыль вдоль формы
  float sp = 0.0;
  for (int L = 0; L < 2; L++){
    float s = L == 0 ? 38.0 : 70.0;
    vec2 g = p0 * s;
    vec2 c = floor(g), f = fract(g);
    float r = h(c + float(L) * 7.0);
    vec2 pos = 0.5 + 0.3 * vec2(sin(a + r * TAU), cos(a * 2.0 + r * 17.0));
    float dist = length(f - pos);
    float tw = 0.5 + 0.5 * sin(a * 2.0 + r * TAU);
    sp += step(0.86, r) * smoothstep(0.16, 0.0, dist) * tw * smoothstep(0.05, 0.6, b);
  }
  col += vec3(0.55, 1.0, 0.2) * sp * 0.9;

  col += BG;
  col -= h(gl_FragCoord.xy) / 255.0;
  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return;
  const T = 16; // длительность бесшовного цикла, сек

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), cv.width, cv.height);
  const uP = gl.getUniformLocation(pr, 'P');
  const draw = p => { gl.uniform1f(uP, p); gl.drawArrays(gl.TRIANGLES, 0, 3); };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(0.15); return; }

  let running = true;
  const t0 = performance.now();
  const frame = now => {
    if (!running) return;
    draw((((now - t0) / 1000) % T) / T);
    requestAnimationFrame(frame);
  };
  new IntersectionObserver(([e]) => {
    const was = running; running = e.isIntersecting;
    if (running && !was) requestAnimationFrame(frame);
  }).observe(cv);
  requestAnimationFrame(frame);
})();
</script>
