<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green smoke v2 B</title>
<style>
  html, body { margin: 0; height: 100%; background: #111412; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* Фиксированный кадр 16:9 (1920×1080), целиком вписан в окно — ничего не обрезается */
  .stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #111412; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  /* зеркало: ?flip=1 */
  html.flip .stage { transform: scaleX(-1); }
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).get('flip') === '1') document.documentElement.classList.add('flip');</script>
<div class="stage"><canvas id="c" width="1920" height="1080" aria-hidden="true"></canvas></div>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;
uniform float P;
const float TAU = 6.2831853;
const vec3 BG = vec3(0.0667, 0.0784, 0.0706); // #111412

float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p, float a){
  float s = 0.0, k = 0.5;
  for (int i = 0; i < 5; i++){
    float m = 1.0 + mod(float(i), 2.0);
    vec2 o = vec2(cos(a * m + float(i)), sin(a * m + float(i))) * 0.9;
    s += k * vn(p + o);
    p = p * 2.03 + vec2(17.1, 9.2);
    k *= 0.5;
  }
  return s / 0.97;
}
float seg(vec2 p, vec2 a, vec2 b, float w1, float w2){
  vec2 ab = b - a; float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
  float d = length(p - a - ab * t), w = mix(w1, w2, t);
  return exp(-d * d / (w * w) * 0.9);
}
float blob(vec2 p, vec2 c, float rx, float ry){
  vec2 e = p - c; return exp(-(e.x * e.x / (rx * rx) + e.y * e.y / (ry * ry)));
}

const vec2 CORE0 = vec2(0.0576,0.0352);
const vec2 CORE1 = vec2(0.2816,0.0448);
const float SPREAD = 0.7;
const float WARP = 0.17;
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  float a = P * TAU;
  vec2 p0 = vec2(uv.x * asp, uv.y);
  vec2 pc = p0 - vec2(asp * 0.5, 0.5);

  // энергетический завиток вокруг ядра
  vec2 d0 = pc - CORE0; float r0 = length(d0);
  float ang = 0.5 * sin(a) * exp(-r0 * 2.0);
  float cs = cos(ang), sn = sin(ang);
  vec2 ps = CORE0 + vec2(cs * d0.x - sn * d0.y, sn * d0.x + cs * d0.y);

  // двойной варп — округлые, «взбитые» формы
  vec2 w1 = vec2(fbm(ps * 1.6 + 3.0, a), fbm(ps * 1.6 + vec2(5.2, 1.3), a + 1.0)) - 0.5;
  vec2 w2 = vec2(fbm(ps * 3.6 + w1 * 1.6, a + 2.0), fbm(ps * 3.6 + vec2(1.7, 8.3) + w1 * 1.6, a + 3.0)) - 0.5;
  vec2 q = ps + w1 * WARP + w2 * 0.06;
  vec2 p = q;

  float b = 0.0, hb = 0.0;
  b = max(b, seg(p, vec2(-0.6911,-0.0768), vec2(-0.5823,0.0192), 0.0077, 0.0256));
  b = max(b, blob(p, vec2(-0.6820,-0.0688), 0.0119, 0.0119) * 0.75);
  b = max(b, blob(p, vec2(-0.6639,-0.0528), 0.0158, 0.0158) * 0.75);
  b = max(b, blob(p, vec2(-0.6458,-0.0368), 0.0197, 0.0197) * 0.75);
  b = max(b, blob(p, vec2(-0.6276,-0.0208), 0.0236, 0.0236) * 0.75);
  b = max(b, blob(p, vec2(-0.6095,-0.0048), 0.0275, 0.0275) * 0.75);
  b = max(b, blob(p, vec2(-0.5914,0.0112), 0.0313, 0.0313) * 0.75);
  b = max(b, seg(p, vec2(-0.5823,0.0192), vec2(-0.4863,0.0640), 0.0256, 0.0320));
  b = max(b, blob(p, vec2(-0.5703,0.0248), 0.0343, 0.0343) * 0.75);
  b = max(b, blob(p, vec2(-0.5463,0.0360), 0.0364, 0.0364) * 0.75);
  b = max(b, blob(p, vec2(-0.5223,0.0472), 0.0385, 0.0385) * 0.75);
  b = max(b, blob(p, vec2(-0.4983,0.0584), 0.0406, 0.0406) * 0.75);
  b = max(b, seg(p, vec2(-0.4863,0.0640), vec2(-0.3903,0.0640), 0.0320, 0.0352));
  b = max(b, blob(p, vec2(-0.4703,0.0640), 0.0423, 0.0423) * 0.75);
  b = max(b, blob(p, vec2(-0.4383,0.0640), 0.0437, 0.0437) * 0.75);
  b = max(b, blob(p, vec2(-0.4063,0.0640), 0.0451, 0.0451) * 0.75);
  b = max(b, seg(p, vec2(-0.3903,0.0640), vec2(-0.3136,0.0192), 0.0352, 0.0384));
  b = max(b, blob(p, vec2(-0.3711,0.0528), 0.0468, 0.0468) * 0.75);
  b = max(b, blob(p, vec2(-0.3328,0.0304), 0.0489, 0.0489) * 0.75);
  b = max(b, seg(p, vec2(-0.3136,0.0192), vec2(-0.2304,-0.0128), 0.0384, 0.0384));
  b = max(b, blob(p, vec2(-0.2928,0.0112), 0.0499, 0.0499) * 0.75);
  b = max(b, blob(p, vec2(-0.2512,-0.0048), 0.0499, 0.0499) * 0.75);
  b = max(b, seg(p, vec2(-0.2304,-0.0128), vec2(-0.1344,-0.0192), 0.0384, 0.0416));
  b = max(b, blob(p, vec2(-0.2064,-0.0144), 0.0510, 0.0510) * 0.75);
  b = max(b, blob(p, vec2(-0.1584,-0.0176), 0.0530, 0.0530) * 0.75);
  b = max(b, seg(p, vec2(-0.1344,-0.0192), vec2(-0.0064,0.0192), 0.0416, 0.0512));
  b = max(b, blob(p, vec2(-0.1131,-0.0128), 0.0562, 0.0562) * 0.75);
  b = max(b, blob(p, vec2(-0.0704,-0.0000), 0.0603, 0.0603) * 0.75);
  b = max(b, blob(p, vec2(-0.0277,0.0128), 0.0645, 0.0645) * 0.75);
  b = max(b, seg(p, vec2(-0.0064,0.0192), vec2(0.0576,0.0384), 0.0512, 0.0576));
  b = max(b, blob(p, vec2(0.0256,0.0288), 0.0707, 0.0707) * 0.75);
  b = max(b, seg(p, vec2(0.0576,0.0384), vec2(0.1856,0.0640), 0.0576, 0.0448));
  b = max(b, blob(p, vec2(0.0896,0.0448), 0.0707, 0.0707) * 0.75);
  b = max(b, blob(p, vec2(0.1536,0.0576), 0.0624, 0.0624) * 0.75);
  b = max(b, seg(p, vec2(0.1856,0.0640), vec2(0.2816,0.0768), 0.0448, 0.0384));
  b = max(b, blob(p, vec2(0.2096,0.0672), 0.0562, 0.0562) * 0.75);
  b = max(b, blob(p, vec2(0.2576,0.0736), 0.0520, 0.0520) * 0.75);
  b = max(b, seg(p, vec2(0.2816,0.0768), vec2(0.4415,0.0576), 0.0384, 0.0320));
  b = max(b, blob(p, vec2(0.2976,0.0749), 0.0491, 0.0491) * 0.75);
  b = max(b, blob(p, vec2(0.3296,0.0710), 0.0474, 0.0474) * 0.75);
  b = max(b, blob(p, vec2(0.3615,0.0672), 0.0458, 0.0458) * 0.75);
  b = max(b, blob(p, vec2(0.3935,0.0634), 0.0441, 0.0441) * 0.75);
  b = max(b, blob(p, vec2(0.4255,0.0595), 0.0424, 0.0424) * 0.75);
  b = max(b, seg(p, vec2(0.4415,0.0576), vec2(0.5119,0.0512), 0.0320, 0.0160));
  b = max(b, blob(p, vec2(0.4533,0.0565), 0.0381, 0.0381) * 0.75);
  b = max(b, blob(p, vec2(0.4767,0.0544), 0.0312, 0.0312) * 0.75);
  b = max(b, blob(p, vec2(0.5002,0.0523), 0.0243, 0.0243) * 0.75);
  b = max(b, seg(p, vec2(0.0576,0.0320), vec2(0.1536,-0.0256), 0.0448, 0.0448));
  b = max(b, blob(p, vec2(0.0816,0.0176), 0.0582, 0.0582) * 0.75);
  b = max(b, blob(p, vec2(0.1296,-0.0112), 0.0582, 0.0582) * 0.75);
  b = max(b, seg(p, vec2(0.1536,-0.0256), vec2(0.2496,-0.0512), 0.0448, 0.0384));
  b = max(b, blob(p, vec2(0.1776,-0.0320), 0.0562, 0.0562) * 0.75);
  b = max(b, blob(p, vec2(0.2256,-0.0448), 0.0520, 0.0520) * 0.75);
  b = max(b, seg(p, vec2(0.2496,-0.0512), vec2(0.3775,-0.0768), 0.0384, 0.0288));
  b = max(b, blob(p, vec2(0.2656,-0.0544), 0.0484, 0.0484) * 0.75);
  b = max(b, blob(p, vec2(0.2976,-0.0608), 0.0452, 0.0452) * 0.75);
  b = max(b, blob(p, vec2(0.3296,-0.0672), 0.0421, 0.0421) * 0.75);
  b = max(b, blob(p, vec2(0.3615,-0.0736), 0.0390, 0.0390) * 0.75);
  b = max(b, seg(p, vec2(0.3775,-0.0768), vec2(0.5055,-0.0768), 0.0288, 0.0288));
  b = max(b, blob(p, vec2(0.3935,-0.0768), 0.0374, 0.0374) * 0.75);
  b = max(b, blob(p, vec2(0.4255,-0.0768), 0.0374, 0.0374) * 0.75);
  b = max(b, blob(p, vec2(0.4575,-0.0768), 0.0374, 0.0374) * 0.75);
  b = max(b, blob(p, vec2(0.4895,-0.0768), 0.0374, 0.0374) * 0.75);
  b = max(b, seg(p, vec2(0.5055,-0.0768), vec2(0.6335,-0.0512), 0.0288, 0.0256));
  b = max(b, blob(p, vec2(0.5183,-0.0742), 0.0370, 0.0370) * 0.75);
  b = max(b, blob(p, vec2(0.5439,-0.0691), 0.0362, 0.0362) * 0.75);
  b = max(b, blob(p, vec2(0.5695,-0.0640), 0.0354, 0.0354) * 0.75);
  b = max(b, blob(p, vec2(0.5951,-0.0589), 0.0345, 0.0345) * 0.75);
  b = max(b, blob(p, vec2(0.6207,-0.0538), 0.0337, 0.0337) * 0.75);
  b = max(b, seg(p, vec2(0.6335,-0.0512), vec2(0.6975,0.0160), 0.0256, 0.0064));
  b = max(b, blob(p, vec2(0.6415,-0.0428), 0.0302, 0.0302) * 0.75);
  b = max(b, blob(p, vec2(0.6575,-0.0260), 0.0239, 0.0239) * 0.75);
  b = max(b, blob(p, vec2(0.6735,-0.0092), 0.0177, 0.0177) * 0.75);
  b = max(b, blob(p, vec2(0.6895,0.0076), 0.0114, 0.0114) * 0.75);
  b = max(b, blob(p, vec2(0.0576,0.0384), 0.1664, 0.0576) * 0.9);
  b = max(b, blob(p, vec2(0.2816,0.0448), 0.1600, 0.0576) * 0.5);
  b = max(b, blob(p, vec2(0.2496,-0.0448), 0.1280, 0.0448) * 0.5);
  hb = max(hb, blob(p, vec2(0.0576,0.0352), 0.1088, 0.0320) * 1.0);
  hb = max(hb, 0.35 * b * b);
  float body = clamp(1.0 - exp(-b * 1.7), 0.0, 1.3);

  float n = fbm(q * 4.0 + vec2(0.0, 3.0), a);
  float ridge = pow(1.0 - abs(2.0 * n - 1.0), 2.0);
  float n2 = fbm(q * 8.0, a);
  float fil = ridge * 0.7 + 0.45 * n2;
  float den = body * (0.3 + 1.1 * fil);
  float rq = length(q - CORE0);
  den *= 0.85 + 0.3 * (0.5 + 0.5 * sin(rq * 16.0 - a * 2.0)) * exp(-rq * 1.5);

  float hot = clamp(hb * 1.15, 0.0, 1.0);
  hot = pow(hot, 1.4) * (0.45 + 0.9 * ridge) * (0.88 + 0.24 * sin(a * 2.0));

  vec3 col = vec3(0.03, 0.36, 0.05) * den
           + vec3(0.50, 1.00, 0.10) * pow(den, 2.0) * 1.25
           + vec3(1.00) * hot * hot * 1.8;
  col = 1.0 - exp(-col * 1.4);

  // брызги: круглые капли, вылетающие из ядер по дуге
  float dr = 0.0, dc = 0.0;
  for (int i = 0; i < 26; i++){
    float fi = float(i);
    float r = h(vec2(fi, 3.3)), r2 = h(vec2(fi, 9.1)), r3 = h(vec2(fi, 5.7));
    float ph = fract(P * 2.0 + r);
    vec2 c = mod(fi, 2.0) < 1.0 ? CORE0 : CORE1;
    float an = r2 * TAU;
    vec2 pos = c + vec2(cos(an), sin(an)) * (0.05 + ph * SPREAD * (0.4 + 0.6 * r3));
    pos.y -= 0.12 * ph * ph;
    float sz = (0.004 + 0.010 * r3) * (1.0 - 0.6 * ph);
    float d = length(pc - pos);
    float al = smoothstep(0.0, 0.08, ph) * (1.0 - ph);
    dr += (smoothstep(sz, sz * 0.35, d) + 0.35 * exp(-d * d / (sz * sz * 9.0))) * al;
    dc += smoothstep(sz * 0.5, 0.0, d) * al;
  }
  col += vec3(0.5, 1.0, 0.15) * dr * 0.9 + vec3(1.0) * dc * 0.8;

  // мелкая пыль вдоль формы
  float sp = 0.0;
  for (int L = 0; L < 2; L++){
    float s = L == 0 ? 38.0 : 70.0;
    vec2 g = p0 * s;
    vec2 c = floor(g), f = fract(g);
    float r = h(c + float(L) * 7.0);
    vec2 pos = 0.5 + 0.3 * vec2(sin(a + r * TAU), cos(a * 2.0 + r * 17.0));
    float dist = length(f - pos);
    float tw = 0.5 + 0.5 * sin(a * 2.0 + r * TAU);
    sp += step(0.86, r) * smoothstep(0.16, 0.0, dist) * tw * smoothstep(0.05, 0.6, b);
  }
  col += vec3(0.55, 1.0, 0.2) * sp * 0.9;

  col += BG;
  col -= h(gl_FragCoord.xy) / 255.0;
  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return;
  const T = 16; // длительность бесшовного цикла, сек

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), cv.width, cv.height);
  const uP = gl.getUniformLocation(pr, 'P');
  const draw = p => { gl.uniform1f(uP, p); gl.drawArrays(gl.TRIANGLES, 0, 3); };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(0.15); return; }

  let running = true;
  const t0 = performance.now();
  const frame = now => {
    if (!running) return;
    draw((((now - t0) / 1000) % T) / T);
    requestAnimationFrame(frame);
  };
  new IntersectionObserver(([e]) => {
    const was = running; running = e.isIntersecting;
    if (running && !was) requestAnimationFrame(frame);
  }).observe(cv);
  requestAnimationFrame(frame);
})();
</script>
</body>
