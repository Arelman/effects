<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Green smoke v2 C</title>
<style>
  html, body { margin: 0; height: 100%; background: #111412; overflow: hidden; }
  body { display: grid; place-items: center; }
  /* Фиксированный кадр 16:9 (1920×1080), целиком вписан в окно — ничего не обрезается */
  .stage { width: min(100vw, calc(100vh * 16 / 9)); aspect-ratio: 16 / 9; background: #111412; }
  .stage canvas { width: 100%; height: 100%; display: block; }
  /* зеркало: ?flip=1 */
  html.flip .stage { transform: scaleX(-1); }
</style>
</head>
<body>
<script>if (new URLSearchParams(location.search).get('flip') === '1') document.documentElement.classList.add('flip');</script>
<div class="stage"><canvas id="c" width="1920" height="1080" aria-hidden="true"></canvas></div>

<script id="fs" type="x-shader/x-fragment">
#ifdef GL_FRAGMENT_PRECISION_HIGH
precision highp float;
#else
precision mediump float;
#endif
uniform vec2 R;
uniform float P;
const float TAU = 6.2831853;
const vec3 BG = vec3(0.0667, 0.0784, 0.0706); // #111412

float h(vec2 p){ p = fract(p * vec2(123.34, 456.21)); p += dot(p, p + 45.32); return fract(p.x * p.y); }
float vn(vec2 p){
  vec2 i = floor(p), f = fract(p); f = f * f * (3.0 - 2.0 * f);
  return mix(mix(h(i), h(i + vec2(1.0, 0.0)), f.x), mix(h(i + vec2(0.0, 1.0)), h(i + vec2(1.0, 1.0)), f.x), f.y);
}
float fbm(vec2 p, float a){
  float s = 0.0, k = 0.5;
  for (int i = 0; i < 5; i++){
    float m = 1.0 + mod(float(i), 2.0);
    vec2 o = vec2(cos(a * m + float(i)), sin(a * m + float(i))) * 0.9;
    s += k * vn(p + o);
    p = p * 2.03 + vec2(17.1, 9.2);
    k *= 0.5;
  }
  return s / 0.97;
}
float seg(vec2 p, vec2 a, vec2 b, float w1, float w2){
  vec2 ab = b - a; float t = clamp(dot(p - a, ab) / dot(ab, ab), 0.0, 1.0);
  float d = length(p - a - ab * t), w = mix(w1, w2, t);
  return exp(-d * d / (w * w) * 0.9);
}
float blob(vec2 p, vec2 c, float rx, float ry){
  vec2 e = p - c; return exp(-(e.x * e.x / (rx * rx) + e.y * e.y / (ry * ry)));
}

const vec2 CORE0 = vec2(0.2622,0.1381);
const vec2 CORE1 = vec2(0.3179,-0.0456);
const float SPREAD = 0.8;
const float WARP = 0.17;
void main(){
  vec2 uv = gl_FragCoord.xy / R;
  float asp = R.x / R.y;
  float a = P * TAU;
  vec2 p0 = vec2(uv.x * asp, uv.y);
  vec2 pc = p0 - vec2(asp * 0.5, 0.5);

  // энергетический завиток вокруг ядра
  vec2 d0 = pc - CORE0; float r0 = length(d0);
  float ang = 0.5 * sin(a) * exp(-r0 * 2.0);
  float cs = cos(ang), sn = sin(ang);
  vec2 ps = CORE0 + vec2(cs * d0.x - sn * d0.y, sn * d0.x + cs * d0.y);

  // двойной варп — округлые, «взбитые» формы
  vec2 w1 = vec2(fbm(ps * 1.6 + 3.0, a), fbm(ps * 1.6 + vec2(5.2, 1.3), a + 1.0)) - 0.5;
  vec2 w2 = vec2(fbm(ps * 3.6 + w1 * 1.6, a + 2.0), fbm(ps * 3.6 + vec2(1.7, 8.3) + w1 * 1.6, a + 3.0)) - 0.5;
  vec2 q = ps + w1 * WARP + w2 * 0.06;
  vec2 p = q;

  float b = 0.0, hb = 0.0;
  b = max(b, seg(p, vec2(-0.4448,0.3273), vec2(-0.4114,0.2884), 0.0100, 0.0139));
  b = max(b, blob(p, vec2(-0.4364,0.3176), 0.0143, 0.0143) * 0.75);
  b = max(b, blob(p, vec2(-0.4197,0.2981), 0.0168, 0.0168) * 0.75);
  b = max(b, seg(p, vec2(-0.4114,0.2884), vec2(-0.3501,0.1937), 0.0139, 0.0195));
  b = max(b, blob(p, vec2(-0.4053,0.2789), 0.0188, 0.0188) * 0.75);
  b = max(b, blob(p, vec2(-0.3930,0.2600), 0.0203, 0.0203) * 0.75);
  b = max(b, blob(p, vec2(-0.3808,0.2410), 0.0217, 0.0217) * 0.75);
  b = max(b, blob(p, vec2(-0.3685,0.2221), 0.0232, 0.0232) * 0.75);
  b = max(b, blob(p, vec2(-0.3563,0.2032), 0.0246, 0.0246) * 0.75);
  b = max(b, seg(p, vec2(-0.3501,0.1937), vec2(-0.2666,0.2049), 0.0195, 0.0223));
  b = max(b, blob(p, vec2(-0.3397,0.1951), 0.0258, 0.0258) * 0.75);
  b = max(b, blob(p, vec2(-0.3188,0.1979), 0.0267, 0.0267) * 0.75);
  b = max(b, blob(p, vec2(-0.2980,0.2007), 0.0276, 0.0276) * 0.75);
  b = max(b, blob(p, vec2(-0.2771,0.2035), 0.0285, 0.0285) * 0.75);
  b = max(b, seg(p, vec2(-0.2666,0.2049), vec2(-0.1553,0.2327), 0.0223, 0.0251));
  b = max(b, blob(p, vec2(-0.2555,0.2076), 0.0293, 0.0293) * 0.75);
  b = max(b, blob(p, vec2(-0.2332,0.2132), 0.0300, 0.0300) * 0.75);
  b = max(b, blob(p, vec2(-0.2110,0.2188), 0.0308, 0.0308) * 0.75);
  b = max(b, blob(p, vec2(-0.1887,0.2243), 0.0315, 0.0315) * 0.75);
  b = max(b, blob(p, vec2(-0.1664,0.2299), 0.0322, 0.0322) * 0.75);
  b = max(b, seg(p, vec2(-0.1553,0.2327), vec2(-0.0885,0.2438), 0.0251, 0.0278));
  b = max(b, blob(p, vec2(-0.1386,0.2355), 0.0335, 0.0335) * 0.75);
  b = max(b, blob(p, vec2(-0.1052,0.2410), 0.0353, 0.0353) * 0.75);
  b = max(b, seg(p, vec2(-0.0885,0.2438), vec2(-0.0161,0.1659), 0.0278, 0.0390));
  b = max(b, blob(p, vec2(-0.0764,0.2308), 0.0386, 0.0386) * 0.75);
  b = max(b, blob(p, vec2(-0.0523,0.2049), 0.0434, 0.0434) * 0.75);
  b = max(b, blob(p, vec2(-0.0282,0.1789), 0.0482, 0.0482) * 0.75);
  b = max(b, seg(p, vec2(-0.0161,0.1659), vec2(0.0674,0.1381), 0.0390, 0.0501));
  b = max(b, blob(p, vec2(0.0047,0.1589), 0.0543, 0.0543) * 0.75);
  b = max(b, blob(p, vec2(0.0465,0.1450), 0.0615, 0.0615) * 0.75);
  b = max(b, seg(p, vec2(0.0674,0.1381), vec2(0.2065,0.1381), 0.0501, 0.0668));
  b = max(b, blob(p, vec2(0.1021,0.1381), 0.0706, 0.0706) * 0.75);
  b = max(b, blob(p, vec2(0.1717,0.1381), 0.0814, 0.0814) * 0.75);
  b = max(b, blob(p, vec2(0.2622,0.1492), 0.1447, 0.1280) * 1.0);
  b = max(b, blob(p, vec2(0.3346,0.2772), 0.1058, 0.0946) * 0.8);
  b = max(b, blob(p, vec2(0.3568,-0.0735), 0.1113, 0.1559) * 0.8);
  b = max(b, blob(p, vec2(0.2900,-0.2126), 0.0835, 0.1336) * 0.7);
  b = max(b, blob(p, vec2(0.0952,0.0379), 0.0835, 0.0612) * 0.6);
  b = max(b, blob(p, vec2(0.4014,0.0935), 0.0835, 0.1392) * 0.7);
  hb = max(hb, blob(p, vec2(0.2622,0.1381), 0.1280, 0.1002) * 1.0);
  hb = max(hb, blob(p, vec2(0.3179,-0.0456), 0.0835, 0.1113) * 0.5);
  hb = max(hb, 0.35 * b * b);
  float body = clamp(1.0 - exp(-b * 1.7), 0.0, 1.3);

  float n = fbm(q * 4.0 + vec2(0.0, 3.0), a);
  float ridge = pow(1.0 - abs(2.0 * n - 1.0), 2.0);
  float n2 = fbm(q * 8.0, a);
  float fil = ridge * 0.7 + 0.45 * n2;
  float den = body * (0.3 + 1.1 * fil);
  float rq = length(q - CORE0);
  den *= 0.85 + 0.3 * (0.5 + 0.5 * sin(rq * 16.0 - a * 2.0)) * exp(-rq * 1.5);

  float hot = clamp(hb * 1.15, 0.0, 1.0);
  hot = pow(hot, 1.4) * (0.45 + 0.9 * ridge) * (0.88 + 0.24 * sin(a * 2.0));

  vec3 col = vec3(0.03, 0.36, 0.05) * den
           + vec3(0.50, 1.00, 0.10) * pow(den, 2.0) * 1.25
           + vec3(1.00) * hot * hot * 1.8;
  col = 1.0 - exp(-col * 1.4);

  // брызги: круглые капли, вылетающие из ядер по дуге
  float dr = 0.0, dc = 0.0;
  for (int i = 0; i < 26; i++){
    float fi = float(i);
    float r = h(vec2(fi, 3.3)), r2 = h(vec2(fi, 9.1)), r3 = h(vec2(fi, 5.7));
    float ph = fract(P * 2.0 + r);
    vec2 c = mod(fi, 2.0) < 1.0 ? CORE0 : CORE1;
    float an = r2 * TAU;
    vec2 pos = c + vec2(cos(an), sin(an)) * (0.05 + ph * SPREAD * (0.4 + 0.6 * r3));
    pos.y -= 0.12 * ph * ph;
    float sz = (0.004 + 0.010 * r3) * (1.0 - 0.6 * ph);
    float d = length(pc - pos);
    float al = smoothstep(0.0, 0.08, ph) * (1.0 - ph);
    dr += (smoothstep(sz, sz * 0.35, d) + 0.35 * exp(-d * d / (sz * sz * 9.0))) * al;
    dc += smoothstep(sz * 0.5, 0.0, d) * al;
  }
  col += vec3(0.5, 1.0, 0.15) * dr * 0.9 + vec3(1.0) * dc * 0.8;

  // мелкая пыль вдоль формы
  float sp = 0.0;
  for (int L = 0; L < 2; L++){
    float s = L == 0 ? 38.0 : 70.0;
    vec2 g = p0 * s;
    vec2 c = floor(g), f = fract(g);
    float r = h(c + float(L) * 7.0);
    vec2 pos = 0.5 + 0.3 * vec2(sin(a + r * TAU), cos(a * 2.0 + r * 17.0));
    float dist = length(f - pos);
    float tw = 0.5 + 0.5 * sin(a * 2.0 + r * TAU);
    sp += step(0.86, r) * smoothstep(0.16, 0.0, dist) * tw * smoothstep(0.05, 0.6, b);
  }
  col += vec3(0.55, 1.0, 0.2) * sp * 0.9;

  col += BG;
  col -= h(gl_FragCoord.xy) / 255.0;
  gl_FragColor = vec4(max(col, 0.0), 1.0);
}
</script>

<script>
(() => {
  const cv = document.getElementById('c');
  const gl = cv.getContext('webgl', { antialias: false, alpha: false, powerPreference: 'high-performance' });
  if (!gl) return;
  const T = 16; // длительность бесшовного цикла, сек

  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) console.error(gl.getShaderInfoLog(s)); return s; };
  const pr = gl.createProgram();
  gl.attachShader(pr, sh(gl.VERTEX_SHADER, 'attribute vec2 a;void main(){gl_Position=vec4(a,0.,1.);}'));
  gl.attachShader(pr, sh(gl.FRAGMENT_SHADER, document.getElementById('fs').textContent));
  gl.linkProgram(pr);
  if (!gl.getProgramParameter(pr, gl.LINK_STATUS)) { console.error(gl.getProgramInfoLog(pr)); return; }
  gl.useProgram(pr);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(pr, 'a');
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  gl.viewport(0, 0, cv.width, cv.height);
  gl.uniform2f(gl.getUniformLocation(pr, 'R'), cv.width, cv.height);
  const uP = gl.getUniformLocation(pr, 'P');
  const draw = p => { gl.uniform1f(uP, p); gl.drawArrays(gl.TRIANGLES, 0, 3); };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) { draw(0.15); return; }

  let running = true;
  const t0 = performance.now();
  const frame = now => {
    if (!running) return;
    draw((((now - t0) / 1000) % T) / T);
    requestAnimationFrame(frame);
  };
  new IntersectionObserver(([e]) => {
    const was = running; running = e.isIntersecting;
    if (running && !was) requestAnimationFrame(frame);
  }).observe(cv);
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
